name: 错误报告
description: 报告可复现的程序错误或课程适配问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先确认使用的是最新版本。不要粘贴账号、密码、Cookie、用户编号、签名链接、HAR、完整接口响应、课程媒体或未公开题目与答案。
  - type: input
    id: version
    attributes:
      label: 工具版本
      description: 运行 `mooc-notes --version` 获取。
      placeholder: 0.12.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本，以及浏览器、ffmpeg 或播放器版本（如相关）。
      placeholder: Windows 11 + WSL2；Node.js 22；Chrome 140
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: 课程和资源
      description: 仅填写公开课程代码或链接、资源类型和资源 ID，不要填写账号标识。
      placeholder: ZJU1-1460402161；video 1320673525
  - type: textarea
    id: command
    attributes:
      label: 执行命令
      description: 删除路径中的用户名及所有凭据、令牌和签名参数。
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 说明是否已参加对应期次、是否使用浏览器补采或 `--api-only`。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果
      description: 粘贴脱敏后的完整错误文字；不要上传状态目录、downloads 或抓包。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已删除账号、密码、Cookie、用户编号、签名链接、课程媒体和其他个人信息。
          required: true
