name: 功能建议
description: 建议新的课程整理或播放能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明当前流程遇到的问题，不要包含账号、课程媒体或未公开内容。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的命令行流程、输入和输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 可选。说明已经尝试过的替代方式。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议只处理当前账号有权访问的内容，不要求绕过平台权限或提交测验。
          required: true
